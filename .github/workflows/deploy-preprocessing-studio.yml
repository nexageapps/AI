name: Deploy Data Preprocessing Studio

on:
  push:
    branches: [ main ]
    paths:
      - 'application/neural-networks/week3/data-preprocessing-studio/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: application/neural-networks/week3/data-preprocessing-studio/package-lock.json

      - name: Install dependencies
        working-directory: ./application/neural-networks/week3/data-preprocessing-studio
        run: npm ci

      - name: Build application
        working-directory: ./application/neural-networks/week3/data-preprocessing-studio
        run: npm run build
        env:
          PUBLIC_URL: /AI/neural-networks/week3/data-preprocessing-studio
          CI: false

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847  # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./application/neural-networks/week3/data-preprocessing-studio/build
          destination_dir: neural-networks/week3/data-preprocessing-studio
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
